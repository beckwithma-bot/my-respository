<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="hdr-left">
    <span class="app-logo">⚡ TaskFlow</span>
    <span class="owner-pill">Owner</span>
  </div>
  <div class="hdr-right">
    <button class="btn-accent btn-sm" id="new-task-btn">+ New Task</button>
    <button class="btn-ghost  btn-sm" id="sign-out-btn">Sign out</button>
  </div>
</header>

<!-- Tab nav -->
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="active">
    <span class="tab-icon">⚡</span>Active
  </button>
  <button class="tab-btn" data-tab="completed">
    <span class="tab-icon">✅</span>Done
  </button>
  <button class="tab-btn" data-tab="team">
    <span class="tab-icon">📊</span>Team
  </button>
  <button class="tab-btn" data-tab="inventory">
    <span class="tab-icon">📦</span>Stock
  </button>
</nav>

<!-- Tab content -->
<main class="main">

  <!-- Active tasks -->
  <div id="tab-active">
    <div class="filter-row" id="filter-row">
      <button class="btn-accent filter-btn" data-filter="all">All</button>
      <button class="btn-ghost  filter-btn" data-filter="pending">Pending</button>
      <button class="btn-ghost  filter-btn" data-filter="acknowledged">Acknowledged</button>
    </div>
    <div id="active-list">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Completed -->
  <div id="tab-completed" style="display:none">
    <div id="completed-list">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Team performance -->
  <div id="tab-team" style="display:none">
    <div id="team-list">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Inventory -->
  <div id="tab-inventory" style="display:none">
    <div id="inv-alert" class="alert-banner" style="display:none"></div>
    <div class="sec-hdr">
      <span style="font-weight:700">All Items</span>
      <button class="btn-accent btn-sm" id="add-inv-btn">+ Add Item</button>
    </div>
    <div id="inv-list">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
    <div id="shopping-list" style="display:none"></div>
  </div>

</main>

<!-- ── Create Task Modal ─────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="task-modal">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Create Task</h3>
      <button class="btn-ghost btn-sm" onclick="closeModal('task-modal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="task-form">
        <div class="form-group">
          <label>Title</label>
          <input id="t-title" placeholder="Task title" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="t-desc" placeholder="What needs to be done…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Assign To</label>
            <select id="t-worker" required>
              <option value="">Select worker…</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select id="t-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Due Date &amp; Time</label>
          <input type="datetime-local" id="t-due" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" onclick="closeModal('task-modal')">Cancel</button>
          <button type="submit" class="btn-accent" id="task-submit-btn">Create Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ── Add Inventory Modal ───────────────────────────────────────── -->
<div class="modal-overlay hidden" id="add-inv-modal">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Add Inventory Item</h3>
      <button class="btn-ghost btn-sm" onclick="closeModal('add-inv-modal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="add-inv-form">
        <div class="form-group">
          <label>Item Name</label>
          <input id="ai-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Current Qty</label>
            <input type="number" id="ai-qty" min="0" step="any" required>
          </div>
          <div class="form-group">
            <label>Unit</label>
            <input id="ai-unit" placeholder="lbs, oz, boxes…" required>
          </div>
        </div>
        <div class="form-group">
          <label>Reorder Threshold</label>
          <input type="number" id="ai-threshold" min="0" step="any" required>
        </div>
        <div class="form-group">
          <label>Supplier / Store</label>
          <input id="ai-supplier" placeholder="Optional">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" onclick="closeModal('add-inv-modal')">Cancel</button>
          <button type="submit" class="btn-accent" id="add-inv-btn-submit">Add Item</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ── Edit Inventory Modal ──────────────────────────────────────── -->
<div class="modal-overlay hidden" id="edit-inv-modal">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Edit Item</h3>
      <button class="btn-ghost btn-sm" onclick="closeModal('edit-inv-modal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="edit-inv-form">
        <input type="hidden" id="ei-id">
        <div class="form-group">
          <label>Item Name</label>
          <input id="ei-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Current Qty</label>
            <input type="number" id="ei-qty" min="0" step="any" required>
          </div>
          <div class="form-group">
            <label>Unit</label>
            <input id="ei-unit" required>
          </div>
        </div>
        <div class="form-group">
          <label>Reorder Threshold</label>
          <input type="number" id="ei-threshold" min="0" step="any" required>
        </div>
        <div class="form-group">
          <label>Supplier / Store</label>
          <input id="ei-supplier">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" onclick="closeModal('edit-inv-modal')">Cancel</button>
          <button type="submit" class="btn-accent">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let allTasks   = [];
  let allWorkers = [];
  let inventory  = [];
  let currentTab = 'active';
  let activeFilter = 'all';

  // ── Auth guard ──────────────────────────────────────────────────────────────
  auth.onAuthStateChanged(async user => {
    if (!user) { location.href = 'index.html'; return; }
    const snap = await db.collection('users').doc(user.uid).get();
    if (!snap.exists || snap.data().role !== 'owner') { location.href = 'index.html'; return; }
    init();
  });

  // ── Init ─────────────────────────────────────────────────────────────────────
  function init() {
    document.getElementById('sign-out-btn').onclick = () =>
      auth.signOut().then(() => location.href = 'index.html');

    document.getElementById('new-task-btn').onclick = () =>
      openModal('task-modal');

    document.getElementById('add-inv-btn').onclick = () =>
      openModal('add-inv-modal');

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => showTab(btn.dataset.tab);
    });

    // Filter buttons
    document.getElementById('filter-row').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = b.dataset.filter === activeFilter ? 'btn-accent filter-btn' : 'btn-ghost filter-btn';
      });
      renderActiveTab();
    });

    // Forms
    document.getElementById('task-form').addEventListener('submit', handleCreateTask);
    document.getElementById('add-inv-form').addEventListener('submit', handleAddInventory);
    document.getElementById('edit-inv-form').addEventListener('submit', handleEditInventory);

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', e => {
        if (e.target === overlay) closeModal(overlay.id);
      });
    });

    // Firestore subscriptions
    db.collection('tasks').orderBy('dueDate', 'asc').onSnapshot(snap => {
      allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      refreshCurrentTab();
    });

    db.collection('workers').orderBy('name', 'asc').onSnapshot(snap => {
      allWorkers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      refreshWorkerDropdown();
      if (currentTab === 'team') renderTeamTab();
    });

    db.collection('inventory').orderBy('name', 'asc').onSnapshot(snap => {
      inventory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (currentTab === 'inventory') renderInventoryTab();
    });
  }

  // ── Tab system ───────────────────────────────────────────────────────────────
  function showTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === tab));
    ['active','completed','team','inventory'].forEach(t =>
      document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none');
    refreshCurrentTab();
  }

  function refreshCurrentTab() {
    if (currentTab === 'active')    renderActiveTab();
    if (currentTab === 'completed') renderCompletedTab();
    if (currentTab === 'team')      renderTeamTab();
    if (currentTab === 'inventory') renderInventoryTab();
  }

  // ── Active tasks ─────────────────────────────────────────────────────────────
  function renderActiveTab() {
    const now    = new Date();
    let tasks = allTasks.filter(t => t.status !== 'completed');
    if (activeFilter !== 'all') tasks = tasks.filter(t => t.status === activeFilter);

    document.getElementById('active-list').innerHTML = tasks.length
      ? tasks.map(t => taskRowHTML(t, now)).join('')
      : '<div class="empty-state">No active tasks.</div>';
  }

  function taskRowHTML(task, now) {
    const overdue  = task.status !== 'completed' && new Date(task.dueDate) < now;
    const worker   = allWorkers.find(w => w.id === task.assignedWorker);
    const wName    = worker ? worker.name : task.assignedWorker;
    return `
      <div class="task-row ${overdue ? 'overdue' : ''}">
        <div class="row-info">
          <div class="row-name">
            ${esc(task.title)}
            ${overdue ? '<span class="badge badge-high" style="margin-left:.4rem">overdue</span>' : ''}
          </div>
          <div class="row-meta">${esc(wName)} · Due ${fmtDate(task.dueDate)}</div>
        </div>
        <div class="row-badges">
          <span class="badge badge-${task.priority}">${task.priority}</span>
          <span class="badge badge-${task.status}">${task.status}</span>
        </div>
      </div>`;
  }

  // ── Completed tasks ───────────────────────────────────────────────────────────
  function renderCompletedTab() {
    const done = allTasks
      .filter(t => t.status === 'completed')
      .sort((a, b) => {
        const ta = a.completedAt?.seconds ?? 0;
        const tb = b.completedAt?.seconds ?? 0;
        return tb - ta;
      });

    document.getElementById('completed-list').innerHTML = done.length
      ? done.map(t => {
          const worker = allWorkers.find(w => w.id === t.assignedWorker);
          const wName  = worker ? worker.name : t.assignedWorker;
          return `
            <div class="task-row faded">
              <div class="row-info">
                <div class="row-name">${esc(t.title)}</div>
                <div class="row-meta">
                  ${esc(wName)}
                  ${t.completedAt ? ' · Completed ' + fmtDate(t.completedAt) : ''}
                </div>
              </div>
              <div class="row-badges">
                <span class="badge badge-${t.priority}">${t.priority}</span>
                <span class="badge badge-completed">done</span>
              </div>
            </div>`;
        }).join('')
      : '<div class="empty-state">No completed tasks yet.</div>';
  }

  // ── Team performance ──────────────────────────────────────────────────────────
  function renderTeamTab() {
    const now   = new Date();
    const stats = allWorkers.map(w => {
      const wt   = allTasks.filter(t => t.assignedWorker === w.id);
      const done = wt.filter(t => t.status === 'completed').length;
      const pct  = wt.length ? Math.round(done / wt.length * 100) : 0;
      return {
        name:  w.name,
        total: wt.length,
        done,
        ack:    wt.filter(t => t.status === 'acknowledged').length,
        pend:   wt.filter(t => t.status === 'pending').length,
        over:   wt.filter(t => t.status !== 'completed' && new Date(t.dueDate) < now).length,
        pct,
      };
    }).sort((a, b) => b.pct - a.pct);

    document.getElementById('team-list').innerHTML = stats.length
      ? stats.map(s => {
          const barColor = s.pct >= 80 ? 'var(--accent)' : s.pct >= 50 ? 'var(--yellow)' : 'var(--red)';
          const pctColor = barColor;
          return `
            <div class="perf-card">
              <div class="perf-hdr">
                <div>
                  <div class="perf-name">${esc(s.name)}</div>
                  <div class="perf-sub">${s.done}/${s.total} tasks completed</div>
                </div>
                <div class="perf-pct" style="color:${pctColor}">${s.pct}%</div>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width:${s.pct}%;background:${barColor}"></div>
              </div>
              <div class="stats-row">
                <div class="stat-tile"><div class="stat-val" style="color:var(--accent)">${s.done}</div><div class="stat-lbl">Done</div></div>
                <div class="stat-tile"><div class="stat-val" style="color:var(--yellow)">${s.ack}</div><div class="stat-lbl">Ack'd</div></div>
                <div class="stat-tile"><div class="stat-val" style="color:var(--muted)">${s.pend}</div><div class="stat-lbl">Pending</div></div>
                ${s.over ? `<div class="stat-tile"><div class="stat-val" style="color:var(--red)">${s.over}</div><div class="stat-lbl">Overdue</div></div>` : ''}
              </div>
            </div>`;
        }).join('')
      : '<div class="empty-state">No workers yet.</div>';
  }

  // ── Inventory tab ─────────────────────────────────────────────────────────────
  function renderInventoryTab() {
    const low = inventory.filter(i => i.currentQuantity <= i.reorderThreshold);
    const ok  = inventory.filter(i => i.currentQuantity  > i.reorderThreshold);

    const alertEl = document.getElementById('inv-alert');
    if (low.length) {
      alertEl.style.display = 'block';
      alertEl.textContent   = `⚠️ ${low.length} item${low.length > 1 ? 's' : ''} below reorder threshold`;
    } else {
      alertEl.style.display = 'none';
    }

    document.getElementById('inv-list').innerHTML = inventory.length
      ? [...low, ...ok].map(item => {
          const isLow = item.currentQuantity <= item.reorderThreshold;
          return `
            <div class="inv-row ${isLow ? 'low-stock' : ''}">
              <div class="inv-info">
                <div class="inv-name">${esc(item.name)}</div>
                <div class="inv-meta">
                  ${item.supplierLocation ? '📍 ' + esc(item.supplierLocation) + ' · ' : ''}
                  Updated ${new Date(item.lastUpdated?.seconds ? item.lastUpdated.seconds*1000 : item.lastUpdated || Date.now()).toLocaleDateString()}
                </div>
              </div>
              <div class="inv-right">
                <div class="inv-qty ${isLow ? 'low' : 'ok'}">${item.currentQuantity} ${esc(item.unit)}</div>
                <div class="inv-thresh">Reorder at ${item.reorderThreshold} ${esc(item.unit)}</div>
                ${isLow ? '<span class="badge badge-high">reorder now</span>' : ''}
              </div>
              <button class="btn-ghost btn-sm" onclick='openEdit(${JSON.stringify({id:item.id,name:item.name,qty:item.currentQuantity,unit:item.unit,threshold:item.reorderThreshold,supplier:item.supplierLocation||""})})'>Edit</button>
            </div>`;
        }).join('')
      : '<div class="empty-state">No inventory items yet.</div>';

    // Shopping list
    const shopEl = document.getElementById('shopping-list');
    if (low.length) {
      shopEl.style.display = 'block';
      shopEl.innerHTML = `
        <div class="shopping">
          <h3>🛒 Shopping List</h3>
          <ul>
            ${low.map(i => `
              <li>
                <strong>${esc(i.name)}</strong> —
                need ~${Math.ceil(i.reorderThreshold * 2 - i.currentQuantity)} ${esc(i.unit)}
                ${i.supplierLocation ? `<span class="sup"> · ${esc(i.supplierLocation)}</span>` : ''}
              </li>`).join('')}
          </ul>
        </div>`;
    } else {
      shopEl.style.display = 'none';
    }
  }

  // ── Create task ───────────────────────────────────────────────────────────────
  function refreshWorkerDropdown() {
    const sel = document.getElementById('t-worker');
    const prev = sel.value;
    sel.innerHTML = '<option value="">Select worker…</option>' +
      allWorkers.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
    if (prev) sel.value = prev;
  }

  async function handleCreateTask(e) {
    e.preventDefault();
    const btn = document.getElementById('task-submit-btn');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      await db.collection('tasks').add({
        title:          document.getElementById('t-title').value.trim(),
        description:    document.getElementById('t-desc').value.trim(),
        assignedWorker: document.getElementById('t-worker').value,
        priority:       document.getElementById('t-priority').value,
        dueDate:        document.getElementById('t-due').value,
        status:         'pending',
        createdAt:      firebase.firestore.FieldValue.serverTimestamp(),
      });
      document.getElementById('task-form').reset();
      closeModal('task-modal');
    } finally {
      btn.disabled = false; btn.textContent = 'Create Task';
    }
  }

  // ── Add / edit inventory ──────────────────────────────────────────────────────
  async function handleAddInventory(e) {
    e.preventDefault();
    const btn = document.getElementById('add-inv-btn-submit');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await db.collection('inventory').add({
        name:             document.getElementById('ai-name').value.trim(),
        currentQuantity:  parseFloat(document.getElementById('ai-qty').value),
        unit:             document.getElementById('ai-unit').value.trim(),
        reorderThreshold: parseFloat(document.getElementById('ai-threshold').value),
        supplierLocation: document.getElementById('ai-supplier').value.trim(),
        lastUpdated:      firebase.firestore.FieldValue.serverTimestamp(),
      });
      document.getElementById('add-inv-form').reset();
      closeModal('add-inv-modal');
    } finally {
      btn.disabled = false; btn.textContent = 'Add Item';
    }
  }

  function openEdit({ id, name, qty, unit, threshold, supplier }) {
    document.getElementById('ei-id').value        = id;
    document.getElementById('ei-name').value      = name;
    document.getElementById('ei-qty').value       = qty;
    document.getElementById('ei-unit').value      = unit;
    document.getElementById('ei-threshold').value = threshold;
    document.getElementById('ei-supplier').value  = supplier;
    openModal('edit-inv-modal');
  }

  async function handleEditInventory(e) {
    e.preventDefault();
    const id  = document.getElementById('ei-id').value;
    const btn = e.target.querySelector('[type="submit"]');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await db.collection('inventory').doc(id).update({
        name:             document.getElementById('ei-name').value.trim(),
        currentQuantity:  parseFloat(document.getElementById('ei-qty').value),
        unit:             document.getElementById('ei-unit').value.trim(),
        reorderThreshold: parseFloat(document.getElementById('ei-threshold').value),
        supplierLocation: document.getElementById('ei-supplier').value.trim(),
        lastUpdated:      firebase.firestore.FieldValue.serverTimestamp(),
      });
      closeModal('edit-inv-modal');
    } finally {
      btn.disabled = false; btn.textContent = 'Save Changes';
    }
  }

  // ── Modal helpers ─────────────────────────────────────────────────────────────
  function openModal(id)  { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
</script>
</body>
</html>
